<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Некро-карточная битва (Демо)</title>
    <style>
        /* ====== Базовые стили и фон ====== */
        body {
            margin: 0;
            font-family: 'Georgia', serif;
            background: radial-gradient(circle at center, #1a0033 0%, #000 100%);
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        /* ====== Экран Карты ====== */
        #map-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #d9c9a3; /* Цвет пергамента */
            background-image: radial-gradient(circle, #d9c9a3, #b8a888);
            z-index: 10;
            transition: opacity 1s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .map-title { color: #3e2a13; font-size: 40px; text-shadow: 2px 2px 0 #fff; margin-bottom: 20px;}
        .map-btn { padding: 15px 30px; background: #4a2d7a; color: white; border: none; font-size: 20px; cursor: pointer; border-radius: 10px; }

        /* ====== Экран Боя ====== */
        #battle-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
            background: radial-gradient(circle at center, #1f003d 0%, #05010c 100%);
        }
        #battle-screen.active { opacity: 1; pointer-events: all; }

        /* ====== Верхняя панель (Персонажи) ====== */
        .battle-header {
            display: flex;
            justify-content: space-between;
            padding: 20px 50px;
            align-items: flex-start;
        }
        .character {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .char-portrait {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #a04fff;
            box-shadow: 0 0 15px #a04fff;
            background: #333; /* Замените на <img> */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        .char-stats { display: flex; flex-direction: column; gap: 5px; }
        .char-name { font-size: 24px; text-shadow: 0 0 10px #a04fff; }
        .bar-container { width: 150px; height: 15px; background: #1a1a1a; border: 1px solid #555; border-radius: 5px; overflow: hidden; }
        .bar-fill { height: 100%; transition: width 0.5s; }
        .hp-bar { background: linear-gradient(90deg, #ff0000, #ff5555); }
        .ether-bar { background: linear-gradient(90deg, #0077ff, #55aaff); width: 100%; }

        /* ====== Поле боя (Сетка 3х3) ====== */
        .battlefield {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 600px;
            margin: 50px auto;
        }
        .cell {
            aspect-ratio: 3/4;
            border: 2px solid rgba(160, 79, 255, 0.5);
            border-radius: 10px;
            background: rgba(20, 0, 40, 0.7);
            box-shadow: 0 0 20px rgba(160, 79, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .cell:hover { border-color: #fff; box-shadow: 0 0 20px #fff; }
        .cell.summoned { background: rgba(160, 79, 255, 0.5); border-color: #fff; }

        /* ====== Рука с картами ====== */
        .hand {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
        }
        .card {
            width: 120px;
            height: 180px;
            background: linear-gradient(135deg, #4a00e0, #8e2de2);
            border: 2px solid #fff;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .card:hover { transform: translateY(-30px); box-shadow: 0 15px 30px rgba(140, 0, 255, 0.5); }
        .card.selected { border-color: #00ffcc; box-shadow: 0 0 20px #00ffcc; }
        .card-icon { font-size: 40px; }
        .card-name { font-size: 12px; text-align: center; }
        .card-cost { font-size: 12px; color: #aaa; }

        /* ====== Кнопки действий ====== */
        .action-buttons {
            position: absolute;
            bottom: 20px;
            right: 40px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            padding: 10px 20px;
            border: 2px solid #a04fff;
            background: rgba(20, 0, 40, 0.8);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn:hover { background: #a04fff; color: black; font-weight: bold; }
        .btn-attack { background: #8b0000; border-color: #ff5555;}
        .btn-attack:hover { background: #ff0000; }

        /* Анимация для эффекта удара */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake { animation: shake 0.5s; }
    </style>
</head>
<body>

    <!-- Экран 1: Карта мира -->
    <div id="map-screen">
        <h1 class="map-title">Долина Зелёной Реки</h1>
        <p style="color: #3e2a13;">Найдите врага и вступите в бой</p>
        <br>
        <button class="map-btn" onclick="startBattle()">⚔️ Начать бой</button>
    </div>

    <!-- Экран 2: Поле битвы -->
    <div id="battle-screen">
        
        <!-- Хедер с Персонажами -->
        <div class="battle-header">
            <div class="character">
                <!-- Замените div на <img src="..."> -->
                <div class="char-portrait">🧙</div>
                <div class="char-stats">
                    <div class="char-name">Арион</div>
                    <div class="bar-container"><div class="bar-fill hp-bar" id="playerHp" style="width: 100%"></div></div>
                    <div class="bar-container"><div class="bar-fill ether-bar" id="playerEther" style="width: 100%"></div></div>
                </div>
            </div>

            <div class="character">
                <div class="char-stats" style="align-items: flex-end;">
                    <div class="char-name">Порождение Пустоши</div>
                    <div class="bar-container"><div class="bar-fill hp-bar" id="enemyHp" style="width: 100%"></div></div>
                </div>
                <!-- Замените div на <img src="..."> -->
                <div class="char-portrait">👹</div>
            </div>
        </div>

        <!-- Поле боя (Сетка) -->
        <div class="battlefield">
            <div class="cell" onclick="summonCard(0)"></div>
            <div class="cell" onclick="summonCard(1)"></div>
            <div class="cell" onclick="summonCard(2)"></div>
            
            <div class="cell" onclick="summonCard(3)"></div>
            <div class="cell" onclick="summonCard(4)"></div>
            <div class="cell" onclick="summonCard(5)"></div>
            
            <div class="cell" onclick="summonCard(6)"></div>
            <div class="cell" onclick="summonCard(7)"></div>
            <div class="cell" onclick="summonCard(8)"></div>
        </div>

        <!-- Рука с картами -->
        <div class="hand" id="hand">
            <div class="card" onclick="selectCard(this)">
                <div class="card-icon">🔥</div>
                <div class="card-name">Огненный шар</div>
                <div class="card-cost">Цена: 2 Эфира</div>
            </div>
            <div class="card" onclick="selectCard(this)">
                <div class="card-icon">❄️</div>
                <div class="card-name">Ледяной щит</div>
                <div class="card-cost">Цена: 1 Эфира</div>
            </div>
            <div class="card" onclick="selectCard(this)">
                <div class="card-icon">⚡</div>
                <div class="card-name">Молния</div>
                <div class="card-cost">Цена: 3 Эфира</div>
            </div>
            <div class="card" onclick="selectCard(this)">
                <div class="card-icon">🐉</div>
                <div class="card-name">Призыв Дракона</div>
                <div class="card-cost">Цена: 5 Эфира</div>
            </div>
            <div class="card" onclick="selectCard(this)">
                <div class="card-icon">✨</div>
                <div class="card-name">Магический барьер</div>
                <div class="card-cost">Цена: 2 Эфира</div>
            </div>
        </div>

        <!-- Кнопки -->
        <div class="action-buttons">
            <button class="btn btn-attack" onclick="performAttack()">⚔️ Атаковать</button>
            <button class="btn">🛡️ Защита</button>
            <button class="btn">⏳ Завершить ход</button>
        </div>
    </div>

    <script>
        // Переменные состояния
        let selectedCard = null;

        // Анимация перехода с карты на бой
        function startBattle() {
            const map = document.getElementById('map-screen');
            const battle = document.getElementById('battle-screen');
            
            map.style.opacity = '0';
            setTimeout(() => {
                map.style.display = 'none';
                battle.classList.add('active');
            }, 1000);
        }

        // Выбор карты
        function selectCard(cardElement) {
            // Убираем выделение с других
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
            // Выделяем текущую
            cardElement.classList.add('selected');
            selectedCard = cardElement;
        }

        // Размещение карты на поле
        function summonCard(cellIndex) {
            if (!selectedCard) {
                alert("Сначала выберите карту!");
                return;
            }

            const cells = document.querySelectorAll('.cell');
            if (!cells[cellIndex].classList.contains('summoned')) {
                // Эффект "телепортации" карты
                const icon = selectedCard.querySelector('.card-icon').innerText;
                cells[cellIndex].innerText = icon;
                cells[cellIndex].classList.add('summoned');
                
                // Расход эфира
                const etherBar = document.getElementById('playerEther');
                // Предположим, что эфир = 10, каждая карта стоит 2
                let currentWidth = parseInt(etherBar.style.width);
                etherBar.style.width = Math.max(0, currentWidth - 20) + '%';

                selectedCard.classList.remove('selected');
                selectedCard = null;
            }
        }

        // Функция атаки
        function performAttack() {
            const enemy = document.querySelector('.character:last-child');
            const enemyHpBar = document.getElementById('enemyHp');
            
            // Анимация тряски врага
            enemy.classList.add('shake');
            setTimeout(() => enemy.classList.remove('shake'), 500);
            
            // Урон (например, 25%)
            let currentHp = parseInt(enemyHpBar.style.width);
            enemyHpBar.style.width = Math.max(0, currentHp - 25) + '%';
            
            if (enemyHpBar.style.width === '0%') {
                setTimeout(() => alert("Враг повержен! Победа!"), 500);
            }
        }
    </script>
</body>
</html>
